services:
  - type: web
    name: 2jintegration
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: APP_BASE_URL
        value: https://twojintegration.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: 2jintegration
      - key: NODE_ENV
        value: production
      - key: TWOJ_BASE_URL
        value: https://open.localus111.link
      - key: TWOJ_MCH_ID
        sync: false
      - key: TWOJ_MERCHANT_KEY
        sync: false
      - key: TWOJ_DEFAULT_COUNTRY
        value: ET
      - key: TWOJ_DEFAULT_LANGUAGE
        value: en
      - key: LOBBY_USERNAME
        sync: false
      - key: LOBBY_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DEMO_OP_ID
        value: giftbet-demo-player
      - key: DEMO_NICKNAME
        value: GiftBet Demo
      - key: DEMO_BALANCE_BIRR
        value: 10000
